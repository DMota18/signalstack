version: "3.8"

services:
  # --- Caddy (reverse proxy + automatic HTTPS via Let's Encrypt) ---
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # --- FastAPI Backend ---
  api:
    build: .
    expose:
      - "8000"
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1024M

  # --- Celery Worker ---
  celery-worker:
    build: .
    command: celery -A backend.jobs.celery_app worker -Q intelligence,sync,monitor,maintenance --loglevel=info --concurrency=2
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Celery Beat ---
  celery-beat:
    build: .
    command: celery -A backend.jobs.celery_app beat --loglevel=info
    env_file: .env
    environment:
      - APP_ENV=production
      - DEBUG=false
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 128mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
  caddy-data:
  caddy-config:
